name: CI
on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies if present
        run: |
          if [ -f package.json ]; then
            npm ci
          fi
      - name: Run backend smoke test if available
        run: |
          if [ -x backend/tests/smoke.sh ]; then
            ./backend/tests/smoke.sh
          elif [ -f package.json ] && npm run --silent test; then
            npm test
          else
            echo "No tests detected; CI stub ran successfully."
          fi
